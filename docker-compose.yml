
version: '3.8'

services:
  mercedes-fe:
    container_name: mercedes-fe
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3001:8080
    networks:
      - app-network
    restart: unless-stopped
  
networks:
  app-network:
    name: app-network
    external: true  # Connect to the same network used by Mercedes

